name: Deploy to EC2 via SSM

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Debug SSM
        run: |
          aws ssm describe-instance-information --region ap-southeast-2

      - name: Deploy via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Docker App" \
            --parameters 'commands=[
                "export HOME=/home/ubuntu",
                "sudo chown -R ubuntu:ubuntu /home/ubuntu/nickname_maker",
                "sudo -u ubuntu -i bash -c \"cd /home/ubuntu/nickname_maker && git config --global --add safe.directory /home/ubuntu/nickname_maker && git pull origin main\"",
                "cd /home/ubuntu/nickname_maker && sudo docker compose build --no-cache",
                "cd /home/ubuntu/nickname_maker && sudo docker compose up -d",
                "sudo docker image prune -f"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id $COMMAND_ID \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

          aws ssm list-command-invocations \
            --command-id $COMMAND_ID \
            --details